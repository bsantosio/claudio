version: 2

project_name: claudio

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/claudio
    binary: claudio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X claudio/internal/domain.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: bsantosio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: claudio
    homepage: "https://github.com/bsantosio/claudio"
    description: "Claude CLI proxy — manage AI agents with persistent sessions over your Claude subscription."
    license: "MIT"
    commit_msg_template: "chore: update claudio formula to {{ .Tag }}"
